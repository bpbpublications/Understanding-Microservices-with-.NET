x-service: &service
  image: book-observability:local
  build:
    context: .
    dockerfile: Observability/Dockerfile

services:
  catalog:
    <<: *service
    environment: { Role: catalog, OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317" }
    ports: ["127.0.0.1:5180:8080"]
  basket:
    <<: *service
    environment: { Role: basket, Peers: "http://ordering:8080", OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317" }
    ports: ["127.0.0.1:5181:8080"]
  ordering:
    <<: *service
    environment: { Role: ordering, Peers: "http://payment:8080,http://inventory:8080", OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317" }
    ports: ["127.0.0.1:5182:8080"]
  payment:
    <<: *service
    environment: { Role: payment, DelayMs: "${PAYMENT_DELAY_MS:-0}", OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317" }
  inventory:
    <<: *service
    environment: { Role: inventory, OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317" }
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["127.0.0.1:16686:16686"]
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:9090:9090"]
  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes: ["./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
  grafana:
    image: grafana/grafana:12.2.0
    ports: ["127.0.0.1:3000:3000"]
    environment: { GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer }
    volumes:
      - ./monitoring/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/dashboard.json:/var/lib/grafana/dashboards/book.json:ro
