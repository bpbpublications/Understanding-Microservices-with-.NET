# Create an Azure pipeline using this file. Deploy only when the four lab variables are set.
trigger:
  branches: { include: ['*'] }
pool: { vmImage: ubuntu-latest }
stages:
  - stage: CI
    jobs:
      - job: build
        steps:
          - task: UseDotNet@2
            inputs: { packageType: sdk, version: '10.0.x' }
          - script: dotnet build Solutions/labs/Exercises.sln -c Release
          - script: dotnet test Solutions/labs/Tests -c Release --no-build --logger trx
          - script: bash infra/audit-packages.sh
            workingDirectory: Solutions/labs
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs: { testResultsFormat: VSTest, testResultsFiles: '**/*.trx' }
          - script: |
              dotnet publish Solutions/labs/Observability -c Release -o "$(Build.ArtifactStagingDirectory)/app"
              cd "$(Build.ArtifactStagingDirectory)/app"
              zip -qr ../service.zip .
          - publish: $(Build.ArtifactStagingDirectory)/service.zip
            artifact: release
  - stage: Deploy
    dependsOn: CI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['DEPLOY_LAB'], 'true'))
    jobs:
      - deployment: staging
        environment: book-lab
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: release
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: $(AZURE_SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -eu
                      az webapp deploy -g "$(AZURE_RG)" -n "$(AZURE_APP)" --slot staging --type zip --src-path "$(Pipeline.Workspace)/release/service.zip"
                      curl -fsS --retry 15 --retry-all-errors "https://$(AZURE_APP)-staging.azurewebsites.net/health"
                      az webapp deployment slot swap -g "$(AZURE_RG)" -n "$(AZURE_APP)" --slot staging --target-slot production
