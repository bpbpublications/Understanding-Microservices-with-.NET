global: { scrape_interval: 5s, evaluation_interval: 5s }
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]
scrape_configs:
  - job_name: basket
    static_configs: [{ targets: ["basket:8080"] }]
  - job_name: ordering
    static_configs: [{ targets: ["ordering:8080"] }]
