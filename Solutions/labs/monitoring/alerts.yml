groups:
  - name: book
    rules:
      - alert: BasketHighErrorRate
        expr: |
          sum(rate(book_requests_total{job="basket",outcome="error"}[1m]))
          / sum(rate(book_requests_total{job="basket"}[1m])) > 0.05
          and sum(increase(book_requests_total{job="basket"}[1m])) >= 10
        for: 30s
        labels: { severity: warning }
        annotations: { summary: "More than 5% of Basket operations failed." }
