apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: basket }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: basket }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 50 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: ordering }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ordering }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
