apiVersion: v1
kind: ConfigMap
metadata: { name: catalog-settings }
data: { CatalogService_Message: "Welcome to our Catalog" }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: catalog-blue }
spec:
  replicas: 2
  selector: { matchLabels: { app: catalog, release: blue } }
  template:
    metadata: { labels: { app: catalog, release: blue } }
    spec:
      containers:
        - name: api
          image: book-observability:local
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 80 }]
          envFrom: [{ configMapRef: { name: catalog-settings } }]
          env: [{ name: Role, value: catalog }, { name: ASPNETCORE_HTTP_PORTS, value: "80" }]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"], add: ["NET_BIND_SERVICE"] }
          readinessProbe: { httpGet: { path: /health, port: http } }
          resources: { requests: { cpu: 100m, memory: 96Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: catalog }
spec:
  selector: { app: catalog, release: blue }
  ports: [{ port: 80, targetPort: http }]
